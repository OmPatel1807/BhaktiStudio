version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bhakti_studio_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bhakti_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bhakti_studio_server
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bhakti_studio?schema=public"
      JWT_SECRET: "production_jwt_super_secret_key_bhakti_studio_2026"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bhakti_studio_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  postgres_data:
